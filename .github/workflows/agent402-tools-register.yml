name: Register correct Agent Product Normalizer origin (one-time, free)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/agent402-tools-register.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Register only our verified production origin
        shell: bash
        run: |
          set -euo pipefail
          origin='https://agent-product-normalizer.vercel.app'
          status=$(curl --silent --show-error --max-time 30 \
            -o /tmp/agent402-directory-result.json \
            -w '%{http_code}' \
            -X POST 'https://agent402.tools/api/index/register' \
            -H 'content-type: application/json' \
            --data '{"origin":"https://agent-product-normalizer.vercel.app"}')
          echo "Directory API HTTP status: $status"
          cat /tmp/agent402-directory-result.json
          echo
          if [[ "$status" -lt 200 || "$status" -ge 300 ]]; then
            echo 'Correct-origin registration failed.'
            exit 1
          fi
          node -e "const j=require('/tmp/agent402-directory-result.json'); if(j.origin !== 'https://agent-product-normalizer.vercel.app' || j.listed !== true) { console.error('Unexpected origin or listing state'); process.exit(1) } console.log('Correct origin accepted, public index still needs independent verification')"
