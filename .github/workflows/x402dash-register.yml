name: Register Agent402 No-Progress Gate in x402dash
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/x402dash-register.yml'
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Submit one existing paid x402 endpoint to free public registry
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body --max-time 25 \
            -X POST 'https://api.x402dash.com/v1/register' \
            -H 'Content-Type: application/json' \
            --data '{"url":"https://agent-product-normalizer.vercel.app/api/v1/no-progress-gate","name":"Agent No-Progress Gate","description":"Detect unchanged agent results and retry loops before wasting additional model or tool calls. Deterministic x402 paid endpoint with free example.","category":"AI/Agents","tags":["agents","retry-loop","cost-control","no-progress","x402"]}'
          echo
          echo 'Submitted to x402dash. Verify public search independently before claiming indexed.'
