name: One-time free Agent Bazaar listing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Submit existing public x402 manifest (no payment or credentials)
        run: |
          set -euo pipefail
          curl --fail-with-body --show-error --silent \
            --retry 2 --retry-delay 2 \
            --max-time 35 \
            -X POST 'https://bazaar.saylorinnovations.com/submit' \
            -H 'content-type: application/json' \
            --data '{"manifestUrl":"https://agent-product-normalizer.vercel.app/.well-known/x402.json"}'
          echo
          echo 'Submission request completed; independently verify indexing before claiming a live listing.'
